version: 2

models:
  - name: mairies_plm_arr
    description: >
      Maires des arrondissements PLM
    columns:
      - name: code_commune
        description: Code de la commune
        data_type: TEXT

      - name: secteur
        description: Libellé du secteur
        data_type: TEXT

      - name: nom
        description: Nom de l'élu
        data_type: TEXT

      - name: prenom
        description: Prénom de l'élu
        data_type: TEXT

      - name: genre
        description: Genre de l'élu
        data_type: TEXT

      - name: date_naissance
        description: Date de naissance
        data_type: DATE

      - name: code_CSP
        description: Code de la catégorie socio-professionnelle
        data_type: TEXT

      - name: fonction
        description: Libellé de la fonction
        data_type: TEXT

      - name: age
        description: Âge au moment de l’année analysée
        data_type: INITEGER
