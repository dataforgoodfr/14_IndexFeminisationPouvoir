version: 2

models:
  - name: prefectures
    description: >
      Liste des préfets et préfètes, hauts comissariats TOM. Les préfets de région non inclus, sauf Paris, pour éviter des doublons inutiles

    columns:
      - name: administration
        description: Administration d’appartenance, préfecture, haut commissariat
        data_type: TEXT

      - name: nom
        description: Nom de la personne.
        data_type: TEXT

      - name: prenom
        description: Prénom de la personne.
        data_type: TEXT

      - name: civilite
        description: Civilité de la personne.
        data_type: TEXT

      - name: fonction
        description: Fonction occupée.
        data_type: TEXT

      - name: type_organisme
        description: Type d’organisme associé.
        data_type: TEXT

      - name: code_insee_commune
        description: Code INSEE de la commune.
        data_type: TEXT
