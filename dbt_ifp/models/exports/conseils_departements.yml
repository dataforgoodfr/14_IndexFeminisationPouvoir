version: 2

models:
  - name: conseils_departements
    description: >
      Présidents des conseils départementaux
      
    columns:
      - name: code_departement
        description: Code du département
        data_type: TEXT

      - name: code_canton
        description: Code du canton
        data_type: TEXT

      - name: libelle_canton
        description: Libellé du canton
        data_type: TEXT

      - name: nom
        description: Nom de l'élu
        data_type: TEXT

      - name: prenom
        description: Prénom de l'élu
        data_type: TEXT

      - name: genre
        description: Genre de l'élu
        data_type: TEXT

      - name: date_naissance
        description: Date de naissance
        data_type: DATE

      - name: code_CSP
        description: Code de la catégorie socio-professionnelle
        data_type: TEXT

      - name: fonction
        description: Libellé de la fonction
        data_type: TEXT

      - name: age
        description: Âge au moment de l’année analysée
        data_type: INITEGER
